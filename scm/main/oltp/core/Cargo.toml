[package]
name         = "oltp-svc-core"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/oltp-svc"
rust-version = "1.98"
description  = "oltp-svc core: the technology-free reference implementation of oltp-pattern's TransactionalStore trait (InMemoryTransactionalStore), backed only by std::sync::RwLock. No external dependency -- no spi backend exists yet, see docs/3-design/architecture.md."
keywords     = ["oltp", "core", "async", "swe"]
categories   = ["asynchronous"]

[package.metadata.arch]
application_type = "lib"
service_type     = "oltp"

[lib]
name = "oltp_svc_core"
path = "src/lib.rs"

[dependencies]
oltp-pattern = { git = "https://github.com/sweengineeringlabs/oltp-pattern.git", tag = "v0.1.0" }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
